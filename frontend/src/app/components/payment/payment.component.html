<div class="payment-container" *ngIf="!success">
  <h3>Complete Your Booking</h3>
  <p class="amount">Total Amount: <strong>₹{{ amount }}</strong></p>
  
  <div class="payment-form">
    <div class="form-group">
      <label>Card Number</label>
      <input type="text" placeholder="XXXX-XXXX-XXXX-XXXX" />
    </div>
    <div class="form-row">
      <div class="form-group half">
        <label>Expiry</label>
        <input type="text" placeholder="MM/YY" />
      </div>
      <div class="form-group half">
        <label>CVV</label>
        <input type="password" placeholder="***" />
      </div>
    </div>
    
    <div class="error-msg" *ngIf="error">{{ error }}</div>
    
    <button class="btn" [disabled]="processing" (click)="processPayment()">
      {{ processing ? 'Processing...' : 'Pay Now' }}
    </button>
  </div>
</div>

<div class="success-container" *ngIf="success">
  <div class="icon">✅</div>
  <h3>Payment Successful!</h3>
  <p>Your time travel journey is confirmed. Prepare for adventure!</p>
</div>
