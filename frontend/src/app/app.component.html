<!-- Welcome greeting -->
<aside
  *ngIf="showGreeting"
  class="greeting"
  [class.closing]="greetingClosing"
  role="status"
  aria-live="polite"
>
  <button
    class="greeting-close"
    type="button"
    aria-label="Close greeting"
    (click)="dismissGreeting()"
  >×</button>

  <span class="greeting-hand" aria-hidden="true">👋</span>

  <div class="greeting-body">
    <strong class="greeting-title">Namaste, Time Traveller!</strong>
    <p class="greeting-text">
      Welcome to <b>KaalYatri</b>. Pick any time in history (or the future) and we will take you there safely.
    </p>
    <div class="greeting-actions">
      <a class="greeting-cta" routerLink="/destinations" (click)="dismissGreeting()">
        Explore trips →
      </a>
    </div>
  </div>

  <span class="greeting-sparkle s1">✦</span>
  <span class="greeting-sparkle s2">✦</span>
  <span class="greeting-sparkle s3">✦</span>
</aside>
